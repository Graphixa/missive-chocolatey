name: Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run install/uninstall smoke test (requires admin on runner)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Chocolatey if missing
        shell: pwsh
        run: |
          $chocoExe = Join-Path $env:ProgramData 'chocolatey\bin\choco.exe'
          if (-not (Test-Path -LiteralPath $chocoExe)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:ProgramData 'chocolatey\bin')

      - name: Verify Chocolatey CLI
        shell: pwsh
        run: choco --version

      - name: Pack + verify (fast)
        if: ${{ github.event_name == 'pull_request' || inputs.smoke_test == false }}
        shell: pwsh
        run: ./scripts/Test-Package.ps1

      - name: Full smoke test (pack, verify, install, uninstall)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test == true }}
        shell: pwsh
        run: ./scripts/Test-Package.ps1 -SmokeTest

      - name: Upload .nupkg artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: missive-nupkg
          path: missive/*.nupkg
          if-no-files-found: error
